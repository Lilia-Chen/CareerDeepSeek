<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CareerDeepSeek Observer</title>
    <style>
      body {
        min-width: 520px;
        max-width: 520px;
        margin: 0;
        font: 12px/1.4 system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid #e5e7eb;
      }

      button {
        border: 1px solid #9ca3af;
        border-radius: 4px;
        padding: 6px 10px;
        background: #f9fafb;
        color: #111827;
        cursor: pointer;
      }

      main {
        padding: 10px 12px;
      }

      img {
        display: none;
        width: 100%;
        max-height: 220px;
        object-fit: contain;
        border: 1px solid #e5e7eb;
        margin-bottom: 10px;
      }

      pre {
        max-height: 360px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: 10px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>CareerDeepSeek Observer</strong>
      <button id="observe" type="button">Observe</button>
    </header>
    <main>
      <img id="screenshot" alt="Current tab screenshot">
      <pre id="output">Click Observe.</pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
